<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Conversa WhatsApp → Excel</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1c1c1e;
    --muted: #6b6b70;
    --accent: #25d366;
    --accent-dark: #1da851;
    --border: #dcdce0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --text: #f0f0f0;
      --muted: #a0a0a0;
      --border: #3a3a3a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  .wrap { width: 100%; max-width: 760px; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  p.sub { color: var(--muted); margin-top: 0; margin-bottom: 24px; font-size: 0.95rem; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }
  label { font-weight: 600; font-size: 0.9rem; display: block; margin-bottom: 8px; }
  textarea {
    width: 100%;
    min-height: 260px;
    resize: vertical;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.9rem;
    line-height: 1.4;
  }
  .actions { display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap; align-items: center; }
  button {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: var(--accent-dark); }
  button.secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }
  button.secondary:hover { background: var(--border); }
  .status { font-size: 0.9rem; color: var(--muted); }
  .status.error { color: #e0473e; }
  .status.ok { color: var(--accent-dark); }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.88rem; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; }
  .preview-wrap { max-height: 320px; overflow: auto; border: 1px solid var(--border); border-radius: 8px; }
  details summary { cursor: pointer; font-weight: 600; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Conversa WhatsApp → Planilha Excel</h1>
  <p class="sub">Cole abaixo o texto da conversa (com blocos como <code>*MANHÃ*</code> / <code>*NOITE*</code> e linhas <code>NÚMERO- BAIRRO</code>) e gere a planilha automaticamente.</p>

  <div class="card">
    <label for="input">Texto da conversa</label>
    <textarea id="input" placeholder="*MANHÃ*&#10;&#10;7143- Caminho das Árvores&#10;2294- Pituaçu&#10;...&#10;&#10;*NOITE*&#10;&#10;1436- Pituba"></textarea>
    <div class="actions">
      <button id="convertBtn">Converter e gerar Excel</button>
      <button id="exampleBtn" class="secondary">Carregar exemplo</button>
      <span id="status" class="status"></span>
    </div>
  </div>

  <div class="card" id="previewCard" style="display:none;">
    <details open>
      <summary id="previewSummary">Pré-visualização</summary>
      <div class="preview-wrap">
        <table id="previewTable">
          <thead>
            <tr><th>Manhã/Tarde</th><th>Cotação</th><th>Bairro</th></tr>
          </thead>
          <tbody id="previewBody"></tbody>
        </table>
      </div>
    </details>
  </div>
</div>

<script src="vendor/xlsx.full.min.js"></script>
<script src="app.js"></script>
</body>
</html>
